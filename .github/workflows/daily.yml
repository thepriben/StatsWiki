name: Daily update

on:
  schedule:
    # Primary run — Wikimedia top/day usually ready ~24h after UTC midnight
    - cron: "0 8 * * *"
    # Retry if morning data was not published yet
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ./pipeline

      - name: Fetch pageviews, enrich Wikidata, export JSON
        run: sw-daily

      - name: Tweet top 5 (@StatsWiki)
        if: success()
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: sw-tweet --top 5

      - name: Commit data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ web/public/data/
          git diff --staged --quiet || git commit -m "Daily update $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push

  deploy:
    needs: update
    if: success()
    uses: ./.github/workflows/reusable-deploy.yml
