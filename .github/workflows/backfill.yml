name: Backfill

on:
  workflow_dispatch:
    inputs:
      year:
        description: Year to backfill
        required: true
        type: choice
        options: ["2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025", "2026"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ./pipeline

      - name: Sync with main
        run: git pull origin main

      - name: Ingest pageviews + Wikidata + export
        run: sw-backfill --year ${{ inputs.year }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ web/public/data/
          git diff --staged --quiet || git commit -m "Backfill ${{ inputs.year }} with Wikidata"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort
            git merge origin/main --no-edit || true
            git diff --name-only --diff-filter=U | while read -r f; do
              case "$f" in
                data/*) git checkout --ours -- "$f" ;;
                web/public/data/q/*) git rm -f -- "$f" ;;
                *) git checkout --ours -- "$f" ;;
              esac
            done
            sw-export-qids
            git add data/ web/public/data/
            git diff --staged --quiet || git commit -m "Backfill ${{ inputs.year }} with Wikidata"
          fi
          git push

  deploy:
    needs: backfill
    uses: ./.github/workflows/reusable-deploy.yml
