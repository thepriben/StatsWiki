[project]
name = "statswiki"
version = "3.0.0"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15.0",
    "requests>=2.31",
    "tweepy>=4.14",
]

[project.scripts]
sw-fetch = "statswiki.fetch:main"
sw-export = "statswiki.export:main"
sw-daily = "statswiki.daily:main"
sw-backfill = "statswiki.backfill:main"
sw-enrich = "statswiki.wikidata:main"
sw-export-qids = "statswiki.qid_export:main"
sw-tweet = "statswiki.tweet:main"
sw-bsky = "statswiki.bsky:main"
sw-fill-gaps = "statswiki.fill_gaps:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
