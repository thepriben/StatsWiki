name: Bluesky test

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Day to post (YYYY-MM-DD). Default: yesterday"
        required: false
        type: string

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ./pipeline

      - name: Post top 5 to Bluesky
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          ARGS="--top 5 --strict --force"
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ inputs.date }}"
          fi
          sw-bsky $ARGS

      - name: Commit post log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bsky_log.json
          git diff --staged --quiet || git commit -m "Bluesky post log update"
          git pull --rebase origin main
          git push || true
