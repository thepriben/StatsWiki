name: Fill gaps

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  fill-gaps:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -e ./pipeline

      - name: Sync with main
        run: git pull origin main

      - name: Fill missing days and re-export
        run: sw-fill-gaps

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ web/public/data/
          git diff --staged --quiet || git commit -m "Fill missing historical day exports"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort
            git merge origin/main --no-edit || true
            git diff --name-only --diff-filter=U | while read -r f; do
              case "$f" in
                data/*) git checkout --ours -- "$f" ;;
                web/public/data/q/*) git rm -f -- "$f" ;;
                *) git checkout --ours -- "$f" ;;
              esac
            done
            sw-export-qids
            git add data/ web/public/data/
            git diff --staged --quiet || git commit -m "Fill missing historical day exports"
          fi
          git push

  deploy:
    needs: fill-gaps
    uses: ./.github/workflows/reusable-deploy.yml
