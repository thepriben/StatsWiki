name: Backfill sequence

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill-year:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        year: [2025, 2024, 2023, 2022, 2021, 2020, 2019, 2018, 2017, 2016]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ./pipeline

      - name: Ingest pageviews + Wikidata + export
        run: sw-backfill --year ${{ matrix.year }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ web/public/data/
          git diff --staged --quiet || git commit -m "Backfill ${{ matrix.year }} with Wikidata"
          git pull --rebase origin main
          git push

  deploy:
    needs: backfill-year
    if: always() && needs.backfill-year.result != 'cancelled'
    uses: ./.github/workflows/reusable-deploy.yml
