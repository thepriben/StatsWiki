name: Deploy Pages

on:
  # Only for frontend code changes. Data publishing is handled by the
  # "Daily update" workflow, so we don't deploy here on data/** pushes — that
  # avoids two workflows racing on the GitHub Pages backend.
  push:
    branches: [main]
    paths:
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/reusable-deploy.yml
