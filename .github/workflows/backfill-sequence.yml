name: Backfill sequence

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill-years:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -e ./pipeline

      - name: Backfill 2025 → 2016 (one year at a time)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for year in 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016; do
            echo "=== Backfill $year ==="
            sw-backfill --year "$year"
            git add data/ web/public/data/
            git diff --staged --quiet || git commit -m "Backfill $year with Wikidata"
            git pull --rebase origin main
            git push
          done

  deploy:
    needs: backfill-years
    if: always() && needs.backfill-years.result != 'cancelled'
    uses: ./.github/workflows/reusable-deploy.yml
