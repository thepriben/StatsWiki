name: Reusable deploy

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one Pages deployment at a time and let it finish; queue any others
# instead of cancelling, which previously caused "Deployment failed, try again
# later" when two runs raced on the Pages backend.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: cd web && npm ci && npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # The GitHub Pages backend occasionally returns a transient
      # "Deployment failed, try again later." Retry once after a short wait so
      # the daily publish self-heals instead of failing the whole run.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retrying Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
